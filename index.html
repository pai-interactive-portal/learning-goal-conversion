<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketercapaian Tujuan Pembelajaran</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .setting-box {
            background-color: #fdfbf7;
            border: 1px solid #e2dcd0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .setting-box select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
        }
        .input-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            flex: 1;
        }
        .input-group.nilai-group {
            flex: 0 0 250px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
        }
        textarea:focus { border-color: #3498db; outline: none; }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-convert { background-color: #2ecc71; color: white; flex: 1 1 200px; }
        .btn-convert:hover { background-color: #27ae60; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-reset:hover { background-color: #c0392b; }

        /* --- FITUR SALIN PADA POP-UP --- */
        .copy-group {
            background-color: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #3498db;
        }
        .copy-group p { margin-top: 0; font-weight: bold; margin-bottom: 10px; color: #2980b9; }
        .copy-btns { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-copy { background-color: #3498db; color: white; flex: 1 1 180px; }
        .btn-copy:hover { background-color: #2980b9; }

        /* --- TABEL POP-UP --- */
        .table-container { overflow-x: auto; max-height: 50vh; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px 8px; text-align: center; font-size: 14px; }
        th { background-color: #34495e; color: white; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .text-left { text-align: left; }
        .badge-t { color: #27ae60; font-weight: bold; }
        .badge-r { color: #c0392b; font-weight: bold; }
		
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 10px;
            color: #7f8c8d;
            font-size: 12px;
            font-weight: 500;
        }

        /* --- STYLES POP-UP MODAL BARU --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9999;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 850px;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 25px;
            transform: scale(0.85);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .modal-close-icon {
            background: none;
            border: none;
            font-size: 22px;
            color: #7f8c8d;
            cursor: pointer;
            padding: 0 5px;
        }
        .modal-close-icon:hover { color: #e74c3c; }
        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }
        .modal-footer {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            text-align: right;
        }
        .btn-modal-close {
            background-color: #7f8c8d;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-modal-close:hover { background-color: #707b7c; }

        /* --- NOTIFIKASI TOAST MELAYANG --- */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            z-index: 10000;
            pointer-events: none;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .modal-alert-icon { font-size: 45px; text-align: center; margin-bottom: 10px; }
        .modal-alert-msg { text-align: center; font-size: 15px; color: #555; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>SISTEM KONVERSI OTOMATIS<br> KETERCAPAIAN TUJUAN PEMBELAJARAN</h2>
    
    <div class="setting-box">
        <label for="jmlTP" style="margin-bottom: 0;">JUMLAH TP:</label>
        <select id="jmlTP">
            <option value="1">1 TP</option>
            <option value="2">2 TP</option>
            <option value="3">3 TP</option>
            <option value="4" selected>4 TP</option>
            <option value="5">5 TP</option>
            <option value="6">6 TP</option>
        </select>
    </div>

    <div class="input-wrapper">
        <div class="input-group">
            <label for="inputNama">Input Data Siswa (Opsional)</label>
            <textarea id="inputNama" placeholder="Adrian Setiawan&#10;Bani Nugroho Surya&#10;Citra"></textarea>
        </div>
        <div class="input-group nilai-group">
            <label for="inputNilai">Input Data Nilai (Wajib)</label>
            <textarea id="inputNilai" placeholder="65&#10;83&#10;75"></textarea>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn-convert" onclick="convertData()">⚡ Konversi Nilai</button>
        <button class="btn-reset" onclick="resetData()">🗑️ Hapus</button>
    </div>
</div>

<div class="footer">
    Dibuat oleh: <br><strong>Dede Ardi Hikmatulloh, S.Th.I</strong><br>© 2025 – Portal PAI Dasar
</div>

<!-- POP-UP MODAL HASIL KONVERSI & FITUR SALIN -->
<div class="modal-overlay" id="customModal">
    <div class="modal-box" id="modalBox">
        <div class="modal-header">
            <h3 id="modalTitle">Hasil Konversi Nilai</h3>
            <button class="modal-close-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalContent">
            <!-- Konten Pop-up Dinamis -->
        </div>
        <div class="modal-footer">
            <button class="btn-modal-close" onclick="closeModal()">Tutup</button>
        </div>
    </div>
</div>

<!-- TOAST NOTIFIKASI SALIN -->
<div class="toast-notification" id="toastNotif">
    📋 Data berhasil disalin!
</div>

<script>
let globalData = []; // Menyimpan data hasil konversi untuk dicopy
let currentTPCount = 4;

function showModal(title, htmlContent, isAlert = false) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalContent').innerHTML = htmlContent;
    
    const modalBox = document.getElementById('modalBox');
    if (isAlert) {
        modalBox.style.maxWidth = '420px';
    } else {
        modalBox.style.maxWidth = '850px';
    }
    
    document.getElementById('customModal').classList.add('active');
}

function closeModal() {
    document.getElementById('customModal').classList.remove('active');
}

function showToast(message) {
    const toast = document.getElementById('toastNotif');
    toast.innerText = message;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}

function calculateTPs(score, count) {
    let tps = [];
    if (count === 1) {
        tps = (score >= 70) ? ['T'] : ['R'];
    } else if (count === 2) {
        if (score < 70) tps = ['R', 'R'];
        else if (score <= 84) tps = ['T', 'R'];
        else tps = ['T', 'T'];
    } else if (count === 3) {
        if (score < 70) tps = ['R', 'R', 'R'];
        else if (score <= 79) tps = ['T', 'R', 'R'];
        else if (score <= 89) tps = ['T', 'T', 'R'];
        else tps = ['T', 'T', 'T'];
    } else if (count === 4) {
        // Skema 4 TP sesuai request
        if (score < 70) tps = ['R', 'R', 'R', 'R'];
        else if (score <= 79) tps = ['T', 'R', 'R', 'R'];
        else if (score <= 89) tps = ['T', 'R', 'R', 'T'];
        else tps = ['T', 'R', 'T', 'T'];
    } else if (count === 5) {
        // Skema 5 TP sesuai request
        if (score < 70) tps = ['R', 'R', 'R', 'R', 'R'];
        else if (score <= 75) tps = ['T', 'R', 'R', 'R', 'R'];
        else if (score <= 80) tps = ['T', 'R', 'T', 'R', 'R'];
        else if (score <= 89) tps = ['T', 'R', 'T', 'T', 'R'];
        else tps = ['T', 'T', 'T', 'T', 'R'];
    } else if (count === 6) {
        if (score < 70) tps = ['R', 'R', 'R', 'R', 'R', 'R'];
        else if (score <= 75) tps = ['T', 'R', 'R', 'R', 'R', 'R'];
        else if (score <= 80) tps = ['T', 'T', 'R', 'R', 'R', 'R'];
        else if (score <= 85) tps = ['T', 'T', 'T', 'R', 'R', 'R'];
        else if (score <= 90) tps = ['T', 'T', 'T', 'T', 'R', 'R'];
        else tps = ['T', 'T', 'T', 'T', 'T', 'T'];
    }
    return tps;
}

function convertData() {
    const txtNama = document.getElementById('inputNama').value;
    const txtNilai = document.getElementById('inputNilai').value;
    currentTPCount = parseInt(document.getElementById('jmlTP').value);
    
    const linesNama = txtNama.split('\n');
    const linesNilai = txtNilai.split('\n');
    
    globalData = []; // Kosongkan data sebelumnya
    let tableBody = '';
    let hasData = false;

    for (let i = 0; i < linesNilai.length; i++) {
        let scoreStr = linesNilai[i].trim();
        if (!scoreStr) continue;

        let name = linesNama[i] ? linesNama[i].trim() : '';
        let score = parseFloat(scoreStr.replace(',', '.'));
        if (isNaN(score)) continue;

        hasData = true;
        let tps = calculateTPs(score, currentTPCount);
        
        // Simpan ke array global
        globalData.push({ name: name, score: score, tps: tps });

        // Buat baris tabel
        let tpCells = tps.map(val => `<td><span class="${val === 'T' ? 'badge-t' : 'badge-r'}">${val}</span></td>`).join('');
        tableBody += `<tr>
            <td class="text-left">${name || '-'}</td>
            <td><strong>${score}</strong></td>
            ${tpCells}
        </tr>`;
    }

    if (hasData) {
        // Render Header tabel dinamis
        let headHtml = `<tr><th>Nama Siswa</th><th>Nilai</th>`;
        for (let i = 1; i <= currentTPCount; i++) { headHtml += `<th>TP ${i}</th>`; }
        headHtml += `</tr>`;
        
        // Susun Tampilan Baru Lengkap di dalam Pop-up Modal (Termasuk Tombol Salin)
        let modalViewHtml = `
            <div class="copy-group">
                <p>MODE SALIN:</p>
                <div class="copy-btns">
                    <button class="btn-copy" onclick="copyData('lengkap')">📋 Nama, Nilai, dan TP</button>
                    <button class="btn-copy" onclick="copyData('nilai_tp')">📋 Nilai dan TP</button>
                    <button class="btn-copy" onclick="copyData('tp_saja')">📋 Hanya TP</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>${headHtml}</thead>
                    <tbody>${tableBody}</tbody>
                </table>
            </div>
        `;
        
        showModal('✨ Hasil Konversi Nilai', modalViewHtml, false);
    } else {
        let alertHtml = `<div class="modal-alert-icon">⚠️</div>
                         <div class="modal-alert-msg">Data nilai tidak ditemukan, pastikan format sudah benar!<br>Silakan, isikan data nilai kembali.</div>`;
        showModal('Peringatan', alertHtml, true);
    }
}

function copyData(mode) {
    if (globalData.length === 0) return;
    
    let textOutput = '';
    
    // Header
    let headers = [];
    if (mode === 'lengkap') {
        headers = ['Nama Siswa', 'Nilai'];
    } else if (mode === 'nilai_tp') {
        headers = ['Nilai'];
    }
    for (let i = 1; i <= currentTPCount; i++) { headers.push(`TP ${i}`); }
    textOutput += headers.join('\t') + '\n';

    // Isi Data
    globalData.forEach(row => {
        let rowData = [];
        if (mode === 'lengkap') {
            rowData.push(row.name || '');
            rowData.push(row.score);
        } else if (mode === 'nilai_tp') {
            rowData.push(row.score);
        }
        rowData.push(...row.tps);
        textOutput += rowData.join('\t') + '\n';
    });

    navigator.clipboard.writeText(textOutput.trim()).then(() => {
        showToast('📋 Data berhasil disalin!');
    }).catch(err => {
        showToast('❌ Gagal menyalin data!');
    });
}

function resetData() {
    document.getElementById('inputNama').value = '';
    document.getElementById('inputNilai').value = '';
    document.getElementById('jmlTP').value = "4";
    globalData = [];
}
</script>

</body>
</html>
